server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compress text responses. Without this the app bundle ships raw
    # (about 900 KB of JS and 470 KB of CSS instead of about 275 KB and 80 KB).
    # Cloudflare also compresses at the edge; this covers direct LAN access and
    # every hop before the edge. text/html is always included when gzip is on.
    # API JSON is left out on purpose: it is small, and keeping compression off
    # responses that carry tokens avoids BREACH-style size leaks at this layer.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/css
        text/plain
        text/javascript
        application/javascript
        application/xml
        image/svg+xml;

    # API reverse proxy to backend
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 10M;
    }

    # Uploaded images reverse proxy
    location /uploads/ {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Vite build output: every file name carries a content hash, so a file
    # never changes under the same URL and can be cached for a year.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The HTML shell must be revalidated on every visit, otherwise browsers
    # keep pointing at the previous deploy's hashed assets.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: serve index.html for client-side routes. Files from
    # public/ (logo, template images) get a short cache.
    location / {
        try_files $uri $uri/ /index.html;
        expires 1d;
    }
}
