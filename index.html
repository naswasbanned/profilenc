<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Profilenc — build a clean, customizable personal profile page with modular blocks and your own link."
    />
    <!-- Fonts are bundled locally (src/styles/fonts.css); no third-party
         stylesheet blocks the first paint. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('profilenc_theme');
          var theme = saved || 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
    <script>
      // Landing page only: start the CMS request now instead of after the app
      // bundle has downloaded, so the hero renders with the real copy on its
      // first paint. Consumed once by src/lib/landingConfig.js.
      (function () {
        if (location.pathname !== '/' || !window.fetch) return;
        window.__PROFILENC_LANDING__ = fetch('/api/site/landing')
          .then(function (res) {
            return res.ok ? res.json() : null;
          })
          .then(function (data) {
            window.__PROFILENC_LANDING_DATA__ = data;
            return data;
          })
          .catch(function () {
            return null;
          });
      })();
    </script>
    <title>Profilenc</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
