name: profilenc

services:
  db:
    image: public.ecr.aws/docker/library/postgres:16-alpine
    container_name: profilenc_db
    restart: unless-stopped
    volumes:
      - profilenc_pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: profilenc
      POSTGRES_USER: profilenc
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U profilenc -d profilenc || pg_isready -U postgres"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 15s

  backend:
    build: ./server
    container_name: profilenc_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - profilenc_uploads:/app/uploads
      - ./public:/app/public:ro
    environment:
      DATABASE_URL: postgres://profilenc:${DB_PASSWORD}@db:5432/profilenc
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      PORT: 3001

  frontend:
    build: .
    container_name: profilenc_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  profilenc_pgdata:
  profilenc_uploads:
