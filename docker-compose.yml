services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - profilenc_pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: profilenc
      POSTGRES_USER: profilenc
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U profilenc"]
      interval: 5s
      retries: 5

  backend:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - profilenc_uploads:/app/uploads
      - ./public:/app/public:ro
    environment:
      DATABASE_URL: postgres://profilenc:${DB_PASSWORD}@db:5432/profilenc
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      PORT: 3001
    ports:
      - "3001:3001"

  frontend:
    build: .
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  profilenc_pgdata:
  profilenc_uploads:
